<div class="w-full max-w-lg">
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
    <div>
      <label class="block text-sm font-medium mb-1">
        Value <span class="text-red-600">*</span>
      </label>
      <input wpmInput type="text" formControlName="value"
        placeholder="e.g. Prepare sprint report" />
      @if (form.controls.value.touched && form.controls.value.invalid) {
      <p class="text-xs text-red-600 mt-1">Value is required.</p>
      }
    </div>

    <div>
      <label class="block text-sm font-medium mb-1">Description</label>
      <textarea wpmInput rows="3" formControlName="description"
        placeholder="Optional details..."></textarea>
    </div>

    <div>
      <label for="priority-color" class="block text-sm font-medium mb-1">Color</label>
      <app-color-picker id="priority-color" formControlName="color" [label]="'Choose color'"
        class="w-full">
      </app-color-picker>
      @if (form.controls.color?.touched && form.controls.color?.invalid) {
        <p class="text-xs text-red-600 mt-1">Please choose a valid color.</p>
      }
    </div>

    <div class="flex items-center justify-between gap-2 pt-4">
      <button type="button" class="rounded border border-slate-300 bg-white px-4 py-2 text-slate-700
       hover:bg-slate-50 shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/30" (click)="cancel.emit()" [disabled]="saving()">
        Cancel
      </button>

      <button type="submit" class="rounded bg-indigo-600 px-4 py-2 text-white shadow-sm
       hover:bg-indigo-600/90 focus:outline-none focus:ring-2 focus:ring-indigo-500/40
       disabled:opacity-50"
        [disabled]="form.invalid || saving()">
        {{ mode() === 'edit' ? (saving() ? 'Saving…' : 'Save changes') : (saving() ? 'Saving…' : 'Create Task Priority') }}
      </button>
    </div>
  </form>
</div>
